[project]
name = "sysrepair-bench-inspect"
version = "0.1.0"
description = "Inspect AI eval harness for SysRepair-Bench scenarios"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.70",
    "openai>=1.50.0",
    "pydantic>=2.7",
    "anyio>=4.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tabulate>=0.9",
    "matplotlib>=3.8",
    "anthropic>=0.97.0",
]

# NOTE: an [project.entry-points.inspect_ai] hook does NOT work for this.
# registry_find (_util/registry.py:236-238) only calls ensure_entry_points()
# when a lookup returns empty; the built-in docker sandbox is always already
# registered, so extensions never load and our config_deserialize patch never
# applies. Use `python -m sysrepair_bench.view` instead of bare `inspect`.
[project.scripts]
sysrepair-view = "sysrepair_bench.view:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sysrepair_bench"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
